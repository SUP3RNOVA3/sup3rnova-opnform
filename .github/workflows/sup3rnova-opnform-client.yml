name: Build SUP3RNOVA OpnForm client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - client/**
      - docker/Dockerfile.client
      - .github/workflows/sup3rnova-opnform-client.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sup3rnova3/sup3rnova-opnform-client:brand.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
